<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReferFlow</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 100px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Arial, sans-serif;
      text-align: center;
      color: #18243b;
      background: #fafbfc;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(40px, 8vw, 60px);
      letter-spacing: -2px;
      color: #174a8b;
    }

    h2 {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.45;
      font-weight: 600;
    }

    .description {
      margin-top: 24px;
      color: #647084;
      font-size: 17px;
    }

    .status {
      margin: 42px auto 30px;
      padding: 24px;
      max-width: 580px;
      border: 1px solid #e0e7f1;
      border-radius: 16px;
      background: #fff;
    }

    .status strong {
      color: #174a8b;
      font-size: 20px;
    }

    .status p {
      margin: 12px 0 0;
      color: #647084;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 8px;
      background: #18243b;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .button:hover { background: #174a8b; }

    .button:focus-visible {
      outline: 3px solid #528bda;
      outline-offset: 4px;
    }

    footer {
      margin-top: 64px;
      color: #647084;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>ReferFlow</h1>
    <h2>
      Beyond Final-Target Localization<br>
      for Complex Referring Expressions
    </h2>

    <p class="description">
      Official project page for ReferFlow.
    </p>

    <div class="status">
      <strong>Coming soon</strong>
      <p>
        Code and leaderboard will be released soon.<br>
        Stay tuned!
      </p>
    </div>

    <a class="button"
       href="https://github.com/V-Insight-AI/ReferFlow">
      GitHub
    </a>

    <footer>V-Insight-AI</footer>
  </main>
</body>
</html>
